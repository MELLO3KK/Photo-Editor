<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhotoEditor | Pro Image Adjustments</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/theme/dracula.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono&display=swap"
        rel="stylesheet">
</head>

<body class="dark-theme">
    <div class="app-container">
        <!-- Sidebar Controls -->
        <aside class="sidebar">
            <div class="brand">
                <div class="preset-icon"
                    style="width: 32px; height: 32px; background: var(--accent); border-radius: 8px; display: flex; align-items: center; justify-content: center; color: white;">
                    📸</div>
                <h1>Photo<span>Editor</span> Pro</h1>
            </div>

            <div class="tabs-nav">
                <button class="tab-btn active" data-tab="settings">Settings</button>
                <button class="tab-btn" data-tab="presets">Presets</button>
            </div>

            <div class="controls-scroll">
                <div id="settingsTab" class="tab-content active">
                    <form id="editorForm">
                        <section class="control-group">
                            <h3>Basic Light <span>✨</span></h3>
                            <div class="control">
                                <label>Exposure <span class="val-badge" id="val-exposure">0</span></label>
                                <input type="range" data-param="exposure" min="-1000" max="1000" step="1" value="0">
                            </div>
                            <div class="control">
                                <label>Brightness <span class="val-badge" id="val-brightness">200</span></label>
                                <input type="range" data-param="brightness" min="0" max="1000" step="1" value="200">
                            </div>
                            <div class="control">
                                <label>Contrast <span class="val-badge" id="val-contrast">200</span></label>
                                <input type="range" data-param="contrast" min="0" max="1000" step="1" value="200">
                            </div>
                        </section>

                        <section class="control-group">
                            <h3>Tone Control <span>🎭</span></h3>
                            <div class="control">
                                <label>Highlights <span class="val-badge" id="val-highlights">0</span></label>
                                <input type="range" data-param="highlights" min="-1000" max="1000" step="1" value="0">
                            </div>
                            <div class="control">
                                <label>Shadows <span class="val-badge" id="val-shadows">0</span></label>
                                <input type="range" data-param="shadows" min="-1000" max="1000" step="1" value="0">
                            </div>
                            <div class="control">
                                <label>Whites <span class="val-badge" id="val-whites">0</span></label>
                                <input type="range" data-param="whites" min="-1000" max="1000" step="1" value="0">
                            </div>
                            <div class="control">
                                <label>Blacks <span class="val-badge" id="val-blacks">0</span></label>
                                <input type="range" data-param="blacks" min="-1000" max="1000" step="1" value="0">
                            </div>
                        </section>

                        <section class="control-group">
                            <h3>Color & Presence <span>🎨</span></h3>
                            <div class="control">
                                <label>Temperature <span class="val-badge" id="val-temperature">0</span></label>
                                <input type="range" data-param="temperature" min="-1000" max="1000" step="1" value="0">
                            </div>
                            <div class="control">
                                <label>Tint <span class="val-badge" id="val-tint">0</span></label>
                                <input type="range" data-param="tint" min="-1000" max="1000" step="1" value="0">
                            </div>
                            <div class="control">
                                <label>Vibrance <span class="val-badge" id="val-vibrance">0</span></label>
                                <input type="range" data-param="vibrance" min="-1000" max="1000" step="1" value="0">
                            </div>
                            <div class="control">
                                <label>Saturation <span class="val-badge" id="val-saturation">200</span></label>
                                <input type="range" data-param="saturation" min="0" max="1000" step="1" value="200">
                            </div>
                            <div class="control">
                                <label>Clarity <span class="val-badge" id="val-clarity">0</span></label>
                                <input type="range" data-param="clarity" min="-1000" max="1000" step="1" value="0">
                            </div>
                            <div class="control">
                                <label>Dehaze <span class="val-badge" id="val-dehaze">0</span></label>
                                <input type="range" data-param="dehaze" min="-1000" max="1000" step="1" value="0">
                            </div>
                        </section>

                        <section class="control-group">
                            <h3>RGB Balancing <span>⚖️</span></h3>
                            <div class="rgb-grid">
                                <div class="control">
                                    <label>Red</label>
                                    <input type="number" data-param="red" min="0" max="1000" value="500" class="numeric-input">
                                </div>
                                <div class="control">
                                    <label>Green</label>
                                    <input type="number" data-param="green" min="0" max="1000" value="500" class="numeric-input">
                                </div>
                                <div class="control">
                                    <label>Blue</label>
                                    <input type="number" data-param="blue" min="0" max="1000" value="500" class="numeric-input">
                                </div>
                            </div>
                        </section>
                    </form>
                </div>

                <div id="presetsTab" class="tab-content">
                    <div id="presetsLibrary" class="presets-library">
                        <!-- Presets will be injected here -->
                    </div>
                </div>
            </div>

            <div class="sidebar-footer">
                <button id="resetAllBtn" class="secondary-btn">Hard Reset</button>
                <div class="btn-grid">
                    <button id="uploadBtn" class="primary-btn">Import</button>
                    <button id="exportBtn" class="primary-btn" disabled>Export</button>
                </div>
                <input type="file" id="imageInput" accept="image/*" hidden>
            </div>
        </aside>

        <!-- Main Content Split -->
        <main class="main-workspace">
            <div class="preview-pane">
                <div class="toolbar">
                    <div class="transform-controls">
                        <button id="rotateLeft" class="icon-btn" title="Rotate Left">↺</button>
                        <button id="rotateRight" class="icon-btn" title="Rotate Right">↻</button>
                        <button id="cropBtn" class="icon-btn" title="Crop">✂️</button>
                    </div>
                    <div class="history-controls">
                        <button id="undoBtn" class="secondary-btn mini" disabled>Undo</button>
                        <button id="redoBtn" class="secondary-btn mini" disabled>Redo</button>
                    </div>
                </div>

                <div id="canvasContainer" class="canvas-container">
                    <div id="dropZone" class="drop-zone">
                        <div class="drop-icon">🖼️</div>
                        <p>Drag an image here to start</p>
                    </div>
                    <canvas id="mainCanvas"></canvas>
                </div>
            </div>

            <div class="editor-pane">
                <div class="pane-header">
                    <h3>JSON Configuration <span>JSON</span></h3>
                    <button id="copyJsonBtn" class="mini-btn">Copy</button>
                </div>
                <div id="jsonEditorContainer"></div>
                <div class="editor-footer">
                    <p id="jsonStatus" class="status-msg">State Synced</p>
                </div>
            </div>
        </main>

        <div class="loading-overlay" id="loadingOverlay">
            <div class="loader"></div>
            <p>Processing...</p>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/mode/javascript/javascript.min.js"></script>
    <script src="{{ url_for('static', filename='js/editor.js') }}"></script>
</body>

</html>
